[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "touhouqa"
version = "0.1.0"
description = "Knowledge benchmark for Touhou Project, built from THWiki."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
touhouqa = "touhouqa.cli:main"

[tool.setuptools.packages.find]
include = ["touhouqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
